[supervisord]
; see supervisord.conf for why the logfile is /dev/null and loglevel is warn
logfile=/dev/null
logfile_maxbytes=0
loglevel=warn
nodaemon=true
; see supervisord.conf — runs as the unprivileged `app` user
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
directory=/app

[program:reverb]
command=php /app/artisan reverb:start --port=8001
numprocs=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes = 0
