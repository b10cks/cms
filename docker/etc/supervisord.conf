[supervisord]
logfile=/dev/stdout
user=root
logfile_maxbytes=0
nodeamon=true

[program:octane]
command=php /app/artisan octane:frankenphp --host=127.0.0.1 --port=8000 --admin-port=2019 --workers=2
numprocs=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes = 0

[program:worker]
command=php /app/artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=60
numprocs=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes = 0

[program:scheduler]
command=php /app/artisan schedule:work --whisper
numprocs=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes = 0

[program:reverb]
command=php /app/artisan reverb:start --port=8001
numprocs=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes = 0
