[supervisord]
logfile=/dev/stdout
user=root
logfile_maxbytes=0
nodeamon=true

[program:octane]
command=php /app/artisan octane:frankenphp --host=127.0.0.1 --port=8000 --admin-port=2019 --workers=4
numprocs=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes = 0

[program:reverb]
command=php /app/artisan reverb:start --port=8001
numprocs=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes = 0
