[supervisord]
logfile=/dev/stdout
logfile_maxbytes=0
nodaemon=true
; supervisord and every program below run as the unprivileged `app` user, so
; its pidfile/child logs have to live somewhere writable (/tmp), not /var/run.
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
directory=/app

; Bind host is configurable because the two deployments differ: on SaaS/ECS a
; host-level proxy reaches the app over loopback, while under Docker Compose
; the published port is forwarded to the *container IP* — a loopback bind is
; unreachable there (and the in-container healthcheck still passes, so the
; container reports healthy while nothing can talk to it). The entrypoint
; defaults this to 127.0.0.1; compose overrides it to 0.0.0.0.
[program:octane]
command=php /app/artisan octane:frankenphp --host=%(ENV_OCTANE_HOST)s --port=8000 --admin-port=2019 --workers=2 --log-level=WARN
numprocs=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes = 0

[program:worker]
command=php /app/artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=60
numprocs=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes = 0

; Long-running jobs (asset package zip builds) run on a dedicated `heavy`
; queue so they don't block the default worker or hit its 60s timeout. Single
; process by design: with the database driver's retry_after=90 a second heavy
; consumer could re-reserve a still-running job.
[program:worker-heavy]
command=php /app/artisan queue:work --queue=heavy --sleep=3 --tries=1 --timeout=900
numprocs=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes = 0

[program:scheduler]
command=php /app/artisan schedule:work --whisper
numprocs=1
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes = 0

