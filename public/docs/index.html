<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Documentation - B10cks CMS</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@4/swagger-ui.css">
    <style>
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }

        *,
        *:before,
        *:after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .topbar {
            background-color: #1e1e1e;
            padding: 10px 0;
            text-align: center;
        }

        .topbar h1 {
            color: #fff;
            margin: 0;
            font-size: 24px;
        }

        .topbar p {
            color: #aaa;
            margin: 5px 0 0 0;
            font-size: 14px;
        }

        .swagger-ui {
            max-width: 100%;
        }

        .swagger-ui .topbar {
            display: none;
        }

        .btn-group {
            text-align: center;
            padding: 20px;
        }

        .btn-group button {
            margin: 0 5px;
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .btn-group button:hover {
            background-color: #45a049;
        }

        .btn-group button.active {
            background-color: #2196F3;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>B10cks CMS - API Documentation</h1>
        <p>Auto-generated OpenAPI documentation</p>
        <div class="btn-group">
            <button onclick="loadSpec('api_v1')">Data API v1</button>
            <button onclick="loadSpec('mgmt_v1')">Management API v1</button>
            <button onclick="loadSpec('auth_v1')">Auth API v1</button>
        </div>
    </div>

    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@4/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@4/swagger-ui-standalone-preset.js"></script>
    <script>
        let swaggerUI = null;
        const specs = {
            api_v1: '/docs/api_v1.json',
            mgmt_v1: '/docs/mgmt_v1.json',
            auth_v1: '/docs/auth_v1.json',
        };

        function loadSpec(specKey) {
            // Update active button
            document.querySelectorAll('.btn-group button').forEach((btn) => {
                btn.classList.remove('active');
            });

            // Find and mark the clicked button as active
            if (event && event.target) {
                event.target.classList.add('active');
            }

            // Load spec
            const url = specs[specKey];

            if (!url) {
                console.error('Spec not found:', specKey);
                return;
            }

            // Fetch the spec
            fetch(url)
                .then((response) => {
                    if (!response.ok) throw new Error('Failed to load spec');
                    return response.json();
                })
                .then((spec) => {
                    // Get the parent container
                    const parent = document.body;
                    const oldContainer = document.getElementById('swagger-ui');

                    // Create a new container
                    const newContainer = document.createElement('div');
                    newContainer.id = 'swagger-ui';

                    // Replace the old container with the new one
                    parent.replaceChild(newContainer, oldContainer);

                    // Initialize Swagger UI with the new spec
                    swaggerUI = SwaggerUIBundle({
                        spec: spec,
                        dom_id: '#swagger-ui',
                        presets: [
                            SwaggerUIBundle.presets.apis,
                            SwaggerUIStandalonePreset,
                        ],
                        layout: 'StandaloneLayout',
                        deepLinking: true,
                        onFailure: (error) => {
                            console.error('Failed to initialize Swagger UI:', error);
                        },
                    });

                    window.ui = swaggerUI;
                })
                .catch((error) => {
                    console.error('Failed to load API spec:', error);
                    const container = document.getElementById('swagger-ui');
                    container.innerHTML = '<div style="padding: 20px; color: red;">Failed to load API specification: ' + error.message + '</div>';
                });
        }

        // Load first spec on page load
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.btn-group button');
            if (buttons.length > 0) {
                buttons[0].classList.add('active');
            }
            loadSpec('api_v1');
        });
    </script>
</body>
</html>
