name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a request, check [existing discussions](https://github.com/b10cks/cms/discussions) and issues for duplicates. Features that gain community traction move up the priority list.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the problem, not just the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you imagine this working?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other approaches you rejected.
  - type: dropdown
    id: contribution
    attributes:
      label: Would you be willing to help implement this?
      options:
        - "Yes"
        - Maybe, with guidance
        - "No"
    validations:
      required: true
